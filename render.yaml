services:
  # 1. Healthcare Backend REST API
  - type: web
    name: healthcare-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: dev
      - key: KEY
        value: SECRETKEY
      - key: ALGORITHM
        value: HS256
      - key: ATLAS_URI
        value: mongodb+srv://srinikaanumula_db_user:PDCnkyj8LQUMW8M3@cluster0.l0dygkc.mongodb.net/healthcare?retryWrites=true&w=majority

  # 2. Healthcare Frontend Web Portal
  - type: web
    name: healthcare-frontend
    env: node
    rootDir: frontend
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node serve-build.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --openssl-legacy-provider
      - key: NPM_CONFIG_LEGACY_PEER_DEPS
        value: "true"
      - key: REACT_APP_SERVER_URL
        fromService:
          type: web
          name: healthcare-backend
          property: host

  # 3. TestPilot AI Testing Platform
  - type: web
    name: testpilot-platform
    env: node
    rootDir: testpilot
    plan: free
    buildCommand: npm install && npx playwright install chromium
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        value: mongodb+srv://srinikaanumula_db_user:PDCnkyj8LQUMW8M3@cluster0.l0dygkc.mongodb.net/healthcare?retryWrites=true&w=majority
      - key: AUT_FRONTEND_URL
        fromService:
          type: web
          name: healthcare-frontend
          property: host
      - key: AUT_BACKEND_URL
        fromService:
          type: web
          name: healthcare-backend
          property: host
